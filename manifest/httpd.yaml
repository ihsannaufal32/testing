apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-test
  namespace: djkn-lelang-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd
        image: registry.redhat.io/rhel9/httpd-24:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 50m
            memory: 256Mi
          request:
            cpu: 40m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  namespace: djkn-lelang-staging
spec:
  selector:
    app: httpd
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
