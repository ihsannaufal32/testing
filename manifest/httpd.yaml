apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-test
  namespace: djkn-lelang-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd-sample
        image: 'image-registry.openshift-image-registry.svc:5000/djkn-lelang-staging/httpd-sample:latest'
        ports:
          - containerPort: 8080
            protocol: TCP
          - containerPort: 8443
            protocol: TCP
        resources:
          limits:
            cpu: 50m
            memory: 256Mi
          request:
            cpu: 40m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: Always     
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  namespace: djkn-lelang-staging
spec:
  selector:
    app: httpd
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
